  <rect class="band" x="24" y="170" width="712" height="56" rx="8"/>
  <text class="onband" x="44" y="196" font-size="16" font-weight="700">AI:在写明的规则内整理、检索、写作</text>
  <text class="onband" x="44" y="216" font-size="12">先读 SYSTEM.md,再读所动那一层的规则 · 不新建平行体系 · 不改写 raw/ · 不编造</text>
